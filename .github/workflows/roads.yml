# The lane model for Teslaplay (asphalt, junctions, lane markings, turn arrows, speed limits,
# traffic lights, bridges and tunnels), built from the OpenStreetMap extract of Georgia and published to the `roads-data` branch,
# which the app reads from raw.githubusercontent.com. Runs weekly, on demand, and when the
# builder changes.
name: Road details

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'   # Mondays 02:17 UTC
  push:
    branches: [main]
    paths:
      - 'scripts/roads/**'
      - '.github/workflows/roads.yml'

permissions:
  contents: write

concurrency:
  group: road-details
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Add more Geofabrik regions here (e.g. "europe/georgia asia/armenia asia/azerbaijan").
      REGIONS: europe/georgia
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pyosmium
        run: pip install osmium

      - name: Download OpenStreetMap extracts
        run: |
          mkdir -p osm
          for r in $REGIONS; do
            curl -sSfL --retry 3 -o "osm/$(basename "$r").osm.pbf" "https://download.geofabrik.de/$r-latest.osm.pbf"
          done
          ls -lh osm

      - name: Extract roads
        run: python scripts/roads/build.py osm/*.osm.pbf raw

      - name: Build the lane model
        run: python scripts/roads/lanes.py raw out

      - name: Publish to the roads-data branch
        run: |
          cd out
          cat > README.md <<'MD'
          Teslaplay's lane model (format v3), generated by `.github/workflows/roads.yml` from
          OpenStreetMap (Geofabrik extracts) with scripts/roads/build.py + lanes.py.
          Data © OpenStreetMap contributors, ODbL 1.0.
          MD
          git init -q -b roads-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Road details from OpenStreetMap ($(date -u +%F))"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" roads-data
